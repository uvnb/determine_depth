# Cấu hình hệ thống xác định tọa độ 3D khối trụ
camera:
  device_index: 0
  frame_width: 640
  frame_height: 480
  fps: 30
  use_threaded_stream: true

calibration:
  calibration_file: "configs/camera_calibration.yaml"
  chessboard_size: [7, 10]      # 88 ô vuông (8 cột x 11 hàng) -> 7 x 10 = 70 điểm giao nhau góc trong
  square_size_mm: 24.0          # Kích thước mỗi ô vuông bàn cờ (24mm)
  image_dir: "calibration/images"

target_object:
  d_real_m: 0.05                # Đường kính thực tế của khối trụ: 5 cm = 0.05 mét
  h_real_m: 0.10                # Chiều cao thực tế của khối trụ: 10 cm = 0.10 mét
  min_contour_area: 300         # Diện tích pixel tối thiểu để lọc nhiễu (giảm nhẹ để nhận diện d=5cm ở xa)

# Hiệu chỉnh khoảng cách thực nghiệm (Distance Tuning):
# Z_cuối_cùng = (Z_pinhole * scale) + offset_m
# - scale: Hệ số bù tỷ lệ quang học (1.0 = giữ nguyên)
# - offset_m: Độ bù mốc đo (0.0 = đo đến tâm trục trụ; -0.025 = đo đến mặt trước của khối trụ có r=2.5cm)
distance_tuning:
  scale: 1.0
  offset_m: 0.0

segmentation:
  # Chế độ màu: "blue" (khối trụ xanh dương), "red" (khối trụ đỏ), hoặc "custom"
  color_mode: "blue"

  # Dải màu xanh dương tối ưu trên nền bảng trắng:
  # Hue: 95 - 130 (xanh lam chuẩn)
  # Saturation: 90 - 255 (loại bỏ hoàn toàn bảng trắng có S < 30)
  # Value: 50 - 255 (loại bỏ bóng đổ tối)
  blue_lower: [95, 90, 50]
  blue_upper: [130, 255, 255]

  # Dải màu khi ở chế độ "custom"
  hsv_lower: [95, 90, 50]
  hsv_upper: [130, 255, 255]

  # Dải màu đỏ dự phòng nếu cần đổi lại
  red_lower1: [0, 70, 50]
  red_upper1: [10, 255, 255]
  red_lower2: [165, 70, 50]
  red_upper2: [180, 255, 255]

  blur_kernel: 5                # Kích thước kernel làm mịn ảnh Gaussian Blur
  morph_kernel: 5               # Kích thước kernel đóng/mở hình thái học

filter:
  enabled: true
  filter_type: "moving_average" # "moving_average" hoặc "kalman"
  window_size: 5                # Kích thước cửa sổ trượt trung bình (frames)
  process_noise: 0.01           # Dùng cho Kalman filter
  measurement_noise: 0.05       # Dùng cho Kalman filter

serial:
  enabled: false                # Bật/Tắt truyền tọa độ qua cổng USB Serial / UART
  port: "/dev/ttyUSB0"          # Cổng serial (Linux: /dev/ttyUSB0, /dev/ttyACM0; Windows: COM3...)
  baudrate: 115200              # Tốc độ baudrate (115200 hoặc 9600)
  format: "string"              # Định dạng gửi: "string" (X:.. Y:.. Z:..) hoặc "json"
  send_rate_hz: 30              # Tần số gửi tọa độ tối đa (Hz)

# Tối ưu hóa hiệu năng & phân bổ lõi CPU cho Raspberry Pi 4B
performance:
  max_fps: 30                   # Giới hạn FPS xử lý (tránh lặp frame vô ích, giải phóng CPU cho AI & Pixhawk)
  opencv_threads: 1             # Số luồng OpenCV (1 luồng để cô lập trên 1 lõi duy nhất)
  target_cpu_core: 1            # Ghim vào Core 1 (giữ Core 0 cho Pixhawk/ESP32, Core 2-3 cho AI)

# Luồng hiển thị video trực tiếp (Local Stream)
local_stream:
  enabled: true                 # Kích hoạt Web Streamer (xem qua trình duyệt máy tính/điện thoại)
  host: "0.0.0.0"               # Lắng nghe mọi card mạng
  port: 8080                    # Cổng truy cập Web: http://<IP_Pi>:8080 (ví dụ http://192.168.50.1:8080)
  stream_fps: 15                # FPS của luồng xem hiển thị (15 FPS là đủ mượt mà tiêu thụ < 3% CPU)
  jpeg_quality: 65              # Chất lượng nén JPEG (50 - 75 để tối ưu hóa truyền dẫn và CPU)

